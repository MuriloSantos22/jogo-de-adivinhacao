<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe a Passagem | Murilete</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%230f172a%22/%3E%3Cpath d=%22M10 17h15c4 0 7 3 7 7v24c0-4-3-7-7-7H10zM54 17H39c-4 0-7 3-7 7v24c0-4 3-7 7-7h15z%22 fill=%22none%22 stroke=%22%23eab308%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-heading">
        <h1>Adivinhe a Passagem</h1>
        <p>por Murilete</p>
    </div>

    <div class="game-container">
        <header>
            <h1>📜 Códice Bíblico</h1>
            <div class="score-board">Pontos: <span id="score">0</span></div>
        </header>

        <div class="story-box" id="story-text">
            Carregando passagem...
        </div>

        <div class="hint-box" id="hint-text"></div>

        <div class="inputs-grid">
            <select id="book-select">
                <option value="">Selecione o Livro...</option>
                <option value="Gênesis">Gênesis</option>
                <option value="Êxodo">Êxodo</option>
                <option value="1 Samuel">1 Samuel</option>
                <option value="Salmos">Salmos</option>
                <option value="Daniel">Daniel</option>
                <option value="Mateus">Mateus</option>
                <option value="João">João</option>
                <option value="Atos">Atos</option>
            </select>
            <input type="number" id="chapter-input" placeholder="Cap." min="1">
            <input type="number" id="verse-input" placeholder="Vers." min="1">
        </div>

        <div class="actions">
            <button class="btn-hint" onclick="showHint()">💡 Dica (-15 pts)</button>
            <button class="btn-submit" onclick="checkAnswer()">Responder</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="btn-next" id="next-button" onclick="nextQuestion()">Próxima história</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
