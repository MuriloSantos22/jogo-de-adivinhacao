<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe a Passagem | Murilete</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%230f172a%22/%3E%3Cpath d=%22M10 17h15c4 0 7 3 7 7v24c0-4-3-7-7-7H10zM54 17H39c-4 0-7 3-7 7v24c0-4 3-7 7-7h15z%22 fill=%22none%22 stroke=%22%23eab308%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-heading">
        <h1>Adivinhe a Passagem</h1>
        <p>por Murilete</p>
    </div>

    <div class="game-container">
        <header>
            <h1>📜 Códice Bíblico</h1>
            <div class="header-actions">
                <button type="button" class="tutorial-button" onclick="openTutorial()">❓ Como jogar</button>
                <div class="score-board">Pontos: <span id="score">0</span></div>
            </div>
        </header>

        <div class="difficulty-bar" aria-label="Nível de dificuldade">
            <span>Dificuldade:</span>
            <div class="difficulty-buttons">
                <button type="button" class="diff-btn active" data-difficulty="facil">Fácil</button>
                <button type="button" class="diff-btn" data-difficulty="medio">Médio</button>
                <button type="button" class="diff-btn" data-difficulty="dificil">Difícil</button>
            </div>
        </div>

        <div class="story-box" id="story-text">
            Carregando passagem...
        </div>

        <div class="hint-box" id="hint-text"></div>

        <div class="inputs-grid">
            <select id="book-select">
                <option value="">Selecione o Livro...</option>
            </select>
            <select id="chapter-select" disabled>
                <option value="">Cap.</option>
            </select>
            <input type="number" id="verse-input" placeholder="Vers." min="1">
        </div>

        <div class="actions">
            <button type="button" class="btn-hint" onclick="showHint()">💡 Dica (-15 pts)</button>
            <button type="button" class="btn-submit" onclick="checkAnswer()">Responder</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <button type="button" class="btn-chapter" id="read-chapter-button" onclick="openChapterModal()">📖 Ler capítulo
            completo</button>
        <button type="button" class="btn-next" id="next-button" onclick="nextQuestion()">Próxima história</button>
    </div>

    <!-- Modal de Leitura do Capítulo Completo -->
    <div id="chapter-modal" class="chapter-modal" role="dialog" aria-modal="true" aria-labelledby="chapter-modal-title">
        <div class="chapter-modal-box">
            <div class="chapter-modal-header">
                <h2 id="chapter-modal-title">Capítulo</h2>
                <button type="button" class="chapter-close-btn" onclick="closeChapterModal()"
                    aria-label="Fechar">✕</button>
            </div>
            <div id="chapter-modal-body" class="chapter-modal-body">
                Carregando capítulo...
            </div>
        </div>
    </div>

    <!-- Tutorial explicativo -->
    <div id="tutorial-modal" class="tutorial-modal" role="dialog" aria-modal="true"
        aria-labelledby="tutorial-title">
        <div class="tutorial-modal-box">
            <div class="tutorial-modal-header">
                <div>
                    <span class="tutorial-eyebrow">Tutorial completo</span>
                    <h2 id="tutorial-title">Como jogar</h2>
                </div>
                <button type="button" class="tutorial-close-btn" onclick="closeTutorial()"
                    aria-label="Fechar tutorial">✕</button>
            </div>

            <div class="tutorial-progress" aria-label="Progresso do tutorial">
                <div id="tutorial-progress-bar" class="tutorial-progress-bar"></div>
            </div>

            <div id="tutorial-content" class="tutorial-content" aria-live="polite" tabindex="-1"></div>

            <div class="tutorial-footer">
                <button type="button" id="tutorial-prev" class="tutorial-prev"
                    onclick="previousTutorialStep()">← Voltar</button>
                <span id="tutorial-step-count" class="tutorial-step-count"></span>
                <button type="button" id="tutorial-next" class="tutorial-next"
                    onclick="nextTutorialStep()">Próximo →</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
